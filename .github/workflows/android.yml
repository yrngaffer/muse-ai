name: Android CI

# Builds the Muse debug APK and runs the JVM unit tests on a free GitHub-hosted runner.
# No local Android toolchain is needed — download the APK from the run's artifacts.

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a full Android SDK (ANDROID_HOME set, licenses pre-accepted);
      # AGP finds it automatically. This is a best-effort top-up for compileSdk 35 and never
      # fails the build (replaces the flaky android-actions/setup-android action).
      - name: Ensure Android SDK platform 35 (best-effort)
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Unit tests (security + logic)
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
